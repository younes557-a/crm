{% extends "base.html" %}
{% block title %}Modifier l'interaction{% endblock %}
{% block content %}
<h1>Interaction avec <a href="{{ url_for('contacts.show', contact_id=interaction.contact_id) }}">{{ interaction.contact.full_name }}</a></h1>
<form class="card" method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  {% include "contacts/_interaction_fields.html" %}
  <button class="btn" type="submit">Enregistrer</button>
  <a href="{{ url_for('contacts.show', contact_id=interaction.contact_id) }}">Annuler</a>
</form>
{% endblock %}
